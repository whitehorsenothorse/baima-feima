<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>白馬非馬</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#fff; overscroll-behavior:none; }
  #reader { width:100%; height:100%; height:100dvh; overflow-x:auto; overflow-y:hidden; touch-action:pan-x; overscroll-behavior-x:contain; scrollbar-width:none; -webkit-overflow-scrolling:touch; }
  #reader::-webkit-scrollbar { display:none; }
  #scroll { display:block; width:auto; height:100%; max-width:none; user-select:none; -webkit-user-select:none; -webkit-user-drag:none; pointer-events:none; }
</style>
</head>
<body>
<div id="reader" aria-label="白馬非馬，從右向左閱讀的橫向長卷"><img id="scroll" src="images/scroll.webp" alt="白馬非馬 中韓文長卷" draggable="false"></div>
<script>
(function(){
 const reader=document.getElementById('reader');
 const image=document.getElementById('scroll');
 let started=false;
 function toStart(){reader.scrollLeft=reader.scrollWidth-reader.clientWidth;}
 function ready(){if(!started){started=true;requestAnimationFrame(()=>requestAnimationFrame(toStart));}}
 if(image.complete) ready(); else image.addEventListener('load',ready,{once:true});
 window.addEventListener('pageshow',function(e){if(e.persisted) return; toStart();});
 window.addEventListener('load',ready,{once:true});
 document.addEventListener('gesturestart',function(e){e.preventDefault();},{passive:false});
 document.addEventListener('gesturechange',function(e){e.preventDefault();},{passive:false});
})();
</script>
</body>
</html>
