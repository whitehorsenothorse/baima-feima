<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,viewport-fit=cover">
<title>白马非马 | 백마비마</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff}
#viewer{position:fixed;inset:0;overflow-x:auto;overflow-y:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:pan-x;scrollbar-width:none}
#viewer::-webkit-scrollbar{display:none}
#art{display:block;height:100%;width:auto;max-width:none;user-select:none;-webkit-user-drag:none}
</style>
</head>
<body>
<main id="viewer" aria-label="白马非马，向右滑动阅读长卷"><img id="art" src="images/scroll.webp" alt="白马非马，白马论现代中文与韩文解释" draggable="false"></main>
<script>
(function(){
 const viewer=document.getElementById('viewer'),art=document.getElementById('art');
 let first=true;
 function right(){viewer.scrollLeft=viewer.scrollWidth-viewer.clientWidth;}
 function init(){if(first){right();requestAnimationFrame(right);first=false;}}
 art.addEventListener('load',init);
 if(art.complete&&art.naturalWidth)init();
 window.addEventListener('resize',()=>{if(viewer.scrollLeft>=viewer.scrollWidth-viewer.clientWidth-20)right()});
})();
</script>
</body>
</html>
